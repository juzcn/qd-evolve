[project]
name = "qd-evolve"
version = "0.1.12"
description = "Multi-agent AI framework with A2A protocol support, group chat, persistent memory, and extensible tool system"
readme = "README.md"
license = "MIT"
authors = [
    { name = "juzcn", email = "zhangjun@cueb.edu.cn" },
]
keywords = ["ai", "agent", "multi-agent", "a2a", "llm", "mqtt", "group-chat"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.13"

dependencies = [
    "anthropic>=0.104.1",
    "pydantic>=2.11",
    "typer>=0.25.1",
    "rich>=14.0.0",
    "jinja2>=3.1",
    "pyyaml>=6.0.3",
    "sqlite-vec>=0.1.9",
    "openai>=2.38.0",
    "prompt-toolkit>=3.0.52",
    "serper-toolkit>=0.0.13",
    "ddgs>=9.0",
    "requests>=2.33.1",
    "mcp>=1.0",
    "textual>=8.0",
    "basic-open-agent-tools[xml]>=1.3.2",
    "coding-open-agent-tools>=0.14.1",
    "defusedxml>=0.7.1", # implicit dependency of coding-open-agent-tools
    "importlib-metadata>=9.0.0", # implicit dependency of opentelemetry (via transformers)
    "tomlkit>=0.15.0",
    "aiohttp>=3.13.5",
    "aiomqtt>=2.5.1",
    "qrcode>=8.0",
    "yt-dlp>=2026.3.17",
    "Pillow>=11.0",
]

[project.urls]
Homepage = "https://github.com/juzcn/qd-evolve"
Repository = "https://github.com/juzcn/qd-evolve"
Issues = "https://github.com/juzcn/qd-evolve/issues"

[project.optional-dependencies]
boat = ["basic-open-agent-tools[all]>=1.3"]
memory = [
    "sentence-transformers>=5.5.1",
    "llama-cpp-python>=0.3.23",
    "numpy>=2.4.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-n auto --tb=short -q --timeout=30"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::RuntimeWarning",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]

[project.scripts]
qd-evolve = "qd_evolve.chat_cli:app"

[tool.uv]
extra-index-url = [
    "https://abetlen.github.io/llama-cpp-python/whl/cpu",
]

[tool.hatch.build.targets.wheel]
packages = ["qd_evolve"]

[tool.hatch.build.targets.wheel.force-include]
"tools" = "qd_evolve/_defaults/tools"
"skills" = "qd_evolve/_defaults/skills"
"config.json.example" = "qd_evolve/_defaults/config.json.example"
"config.minimal.json" = "qd_evolve/_defaults/config.minimal.json"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# ── Pyright ───────────────────────────────────────────────────────
# https://microsoft.github.io/pyright/#/configuration

[tool.pyright]
include = ["qd_evolve", "tests"]
exclude = [".venv", "**/__pycache__", "**/node_modules", ".git", "*.pyc", "**/.*"]
pythonVersion = "3.13"
pythonPlatform = "All"
venvPath = "."
venv = ".venv"

# typeCheckingMode: "basic" | "standard" | "strict"
# standard = basic + extra ~50% rules (unused vars, type-is, etc.)
typeCheckingMode = "standard"

reportMissingTypeStubs = "none"
reportPrivateUsage = "none"

# Uncomment to temporarily suppress noisy categories during cleanup:
# reportUnknownMemberType = "none"
# reportUnknownVariableType = "none"
# reportUnknownArgumentType = "none"
# reportMissingParameterType = "none"
# reportUnknownParameterType = "none"

[[tool.pyright.executionEnvironments]]
root = "tests"
reportUnknownMemberType = "none"
reportMissingParameterType = "none"
reportUnknownArgumentType = "none"

[dependency-groups]
test = [
    "aioresponses>=0.7.8",
    "pytest>=9.0.3",
    "pytest-aiohttp>=1.1.0",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.15.1",
    "pytest-timeout>=2.4.0",
    "pytest-xdist>=3.8.0",
]
