[project]
name = "qd-evolve"
version = "0.1.0"
description = "AI agent with tool use, structured logging, and CLI interface"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "anthropic>=0.52.0",
    "pydantic>=2.11",
    "typer>=0.15.0",
    "rich>=14.0.0",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "sqlite-vec>=0.1.9",
    "openai>=2.35.1",
    "prompt-toolkit>=3.0.52",
    "serper-toolkit>=0.0.13",
    "requests>=2.33.1",
    "sentence-transformers>=5.4.1",
    "numpy>=2.4.4",
    "llama-cpp-python>=0.3.23",
    "mcp>=1.0",
    "textual>=8.0",
    "basic-open-agent-tools[xml]>=1.3.2",
    "markdown-pdf",
    "coding-open-agent-tools>=0.14.1",
    "defusedxml>=0.7.1", # implicit dependency of coding-open-agent-tools
    "importlib-metadata>=6.0,<8.8.0", # implicit dependency of opentelemetry (via transformers)
    "tomlkit>=0.15.0",
    "aiohttp>=3.13.5",
]

[project.optional-dependencies]
boat = ["basic-open-agent-tools[all]>=1.3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-n auto --tb=short -q"
filterwarnings = ["ignore::DeprecationWarning"]

[project.scripts]
qd-evolve = "qd_evolve.chat_cli:app"

[tool.uv]
extra-index-url = [
    "https://abetlen.github.io/llama-cpp-python/whl/cpu",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
test = [
    "aioresponses>=0.7.8",
    "pytest>=9.0.3",
    "pytest-aiohttp>=1.1.0",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.15.1",
]
