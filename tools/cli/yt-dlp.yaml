name: yt-dlp
command: yt-dlp
description: 功能强大的视频下载器，支持从 X/Twitter、YouTube 等 1000+ 网站下载视频和音频
help_summary: "Usage: yt-dlp [OPTIONS] URL [URL...]\n\nGeneral:\n  -h, --help    \
  \              打印帮助信息\n  --version                   打印版本号\n  -i, --ignore-errors\
  \         忽略下载错误\n  -U, --update                检查更新\n\nDownload:\n  -f, --format\
  \ FORMAT         指定视频格式（如 best, bestvideo+bestaudio）\n  -F, --list-formats     \
  \     列出所有可用格式\n  -o, --output TEMPLATE       指定输出文件名模板\n  -P, --paths PATH    \
  \        指定下载路径\n  -N, --concurrent-fragments N 并行下载片段数\n  -r, --limit-rate RATE\
  \       限制下载速度\n  -R, --retries RETRIES       重试次数（默认10，或 infinite）\n  --cookies-from-browser\
  \ BROWSER 从浏览器加载 cookies\n  -x, --extract-audio         提取音频（需要 ffmpeg）\n  --audio-format\
  \ FORMAT       音频格式（mp3, m4a, flac, opus 等）\n  -s, --simulate              模拟下载，不写入磁盘\n\
  \  -j, --dump-json             输出 JSON 格式视频信息\n  --write-subs                下载字幕\n\
  \  --write-thumbnail           下载缩略图\n  --merge-output-format FORMAT 合并格式（mp4/mkv\
  \ 等）\n  --download-sections REGEX   下载指定章节\n\nPost-Processing:\n  --embed-thumbnail\
  \           嵌入缩略图到文件中\n  --embed-metadata            嵌入元数据到文件中\n  --remux-video\
  \ FORMAT        重新封装视频格式\n\nAuthentication:\n  -u, --username USERNAME     登录用户名\n\
  \  -p, --password PASSWORD     登录密码\n  -n, --netrc                 使用 .netrc 认证\n\
  \nNetwork:\n  --proxy URL                 使用代理（HTTP/HTTPS/SOCKS）\n  --socket-timeout\
  \ SECONDS    超时时间"
examples:
- yt-dlp https://x.com/user/status/123456789  — 下载 X/Twitter 视频（最佳质量）
- yt-dlp -f bestvideo+bestaudio -o "%%(title)s.%%(ext)s" https://x.com/user/status/123456789  —
  下载并合并最佳画质+音质
- yt-dlp -x --audio-format mp3 https://x.com/user/status/123456789  — 仅提取音频并转为 MP3
- yt-dlp --cookies-from-browser chrome https://x.com/user/status/123456789  — 使用 Chrome
  cookies 下载
